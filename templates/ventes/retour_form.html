{% extends 'base.html' %}

{% block title %}Retour produit{% endblock %}
{% block page_pretitle %}Vente {{ ligne.vente.numero }}{% endblock %}
{% block page_title %}Enregistrer un retour — {{ ligne.medicament.nom_commercial }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card pg-card">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-medium">Quantité à retourner (max : {{ max_retournable }})</label>
                        <input type="number" name="quantite_retournee" min="1" max="{{ max_retournable }}" value="1" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Motif du retour</label>
                        <textarea name="motif" rows="3" class="form-control" placeholder="Ex : Erreur de délivrance, boîte non ouverte..." required></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="form-check form-switch">
                            <input type="checkbox" name="reintegrer_stock" class="form-check-input" checked>
                            <span class="form-check-label fw-medium">Réintégrer la quantité au lot {{ ligne.lot.numero_lot }} (si produit intact et non périmé)</span>
                        </label>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'ventes:vente_detail' ligne.vente.pk %}" class="btn btn-outline-secondary">Annuler</a>
                        <button type="submit" class="btn btn-warning">Valider le retour</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
