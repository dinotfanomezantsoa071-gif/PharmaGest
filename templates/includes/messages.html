{% if messages %}
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1090;">
    {% for message in messages %}
    <div class="toast pg-toast align-items-center border-0 pg-card" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body d-flex align-items-center gap-2">
                {% if 'success' in message.tags %}
                    <i class="bi bi-check-circle-fill text-success fs-4"></i>
                {% elif 'error' in message.tags or 'danger' in message.tags %}
                    <i class="bi bi-x-circle-fill text-danger fs-4"></i>
                {% elif 'warning' in message.tags %}
                    <i class="bi bi-exclamation-triangle-fill text-warning fs-4"></i>
                {% else %}
                    <i class="bi bi-info-circle-fill text-primary fs-4"></i>
                {% endif %}
                <span>{{ message }}</span>
            </div>
            <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Fermer"></button>
        </div>
    </div>
    {% endfor %}
</div>
{% endif %}
